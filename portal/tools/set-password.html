<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; base-uri 'none'; object-src 'none'">
<title>비밀번호 설정 도구 · My Portal</title>
<script src="../assets/ui.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="../assets/portal.css">
<link rel="stylesheet" href="set-password.css">
</head>
<body>
  <main class="card tool">
    <h1 class="soft">비밀번호 설정 도구</h1>
    <p>이 페이지는 <strong>내 브라우저 안에서만</strong> 계산합니다. 비밀번호는 어디에도 전송·저장되지 않아요.</p>
    <ol>
      <li>새 비밀번호를 두 번 입력하고 <b>설정 파일 만들기</b>를 누르세요. (12자 이상 권장)</li>
      <li>아래에 나온 내용을 복사해 <code>portal/assets/auth-config.js</code> 파일 내용을 <b>통째로</b> 바꾸세요.</li>
      <li>커밋 &amp; 푸시하면 1~2분 뒤 새 비밀번호가 적용됩니다. (기존 로그인은 모두 풀려요)</li>
    </ol>
    <form id="f">
      <label>새 비밀번호 <input id="p1" type="password" autocomplete="new-password" required minlength="8"></label>
      <label>한 번 더 <input id="p2" type="password" autocomplete="new-password" required minlength="8"></label>
      <button class="btn good" type="submit" id="go">설정 파일 만들기</button>
      <p id="msg" class="msg"></p>
    </form>
    <textarea id="out" rows="10" readonly placeholder="여기에 auth-config.js 내용이 만들어집니다."></textarea>
    <button class="btn small" id="copy" type="button" disabled>복사하기</button>
  </main>
  <script src="set-password.js"></script>
</body>
</html>
