  <header class="topbar">
    <a class="brand" href="home.html"><img class="logo" src="assets/logo.svg" alt=""> <span class="brand-text">My Portal</span></a>
    <nav>
      <a href="home.html" aria-current="page">홈</a>
      <a href="office.html">AI 사무실</a>

    <span class="spacer"></span>
    <span class="clock" data-clock></span>
    <button class="theme-toggle" type="button" data-theme-toggle><span class="orb" aria-hidden="true"></span><span class="theme-text">자동</span></button>

  <main class="home">

    </section>

    <section class="tiles">
      <a class="card tile live rise" href="office.html">
        <span class="tile-art office" aria-hidden="true">
          <svg viewBox="0 0 80 80"><rect x="6" y="10" width="68" height="40" rx="8" class="wall"/><rect x="14" y="16" width="22" height="26" rx="4" class="glass"/><rect x="44" y="16" width="22" height="26" rx="4" class="glass"/><circle cx="58" cy="24" r="4" class="sun"/><rect x="6" y="50" width="68" height="22" rx="6" class="floor"/><rect x="20" y="46" width="30" height="8" rx="3" class="desk"/><circle cx="35" cy="38" r="6" class="head"/><rect x="29" y="43" width="12" height="8" rx="4" class="shirt"/><path d="M60 52c0-8 6-10 6-16" class="leaf"/><ellipse cx="66" cy="34" rx="4" ry="6" class="leafy"/><rect x="58" y="52" width="9" height="9" rx="2" class="pot"/></svg>

        <span class="tile-body">
          <strong class="soft">AI 에이전트 사무실</strong>
          <span>에이전트들이 지금 무슨 일을 하는지 보고, 결재를 처리해요.</span>
        </span>
        <span class="tag live">운영 중</span>
      </a>
      <div class="card tile soon rise">
        <span class="tile-art" aria-hidden="true">
          <svg viewBox="0 0 80 80"><rect x="20" y="12" width="40" height="54" rx="6" class="paper"/><rect x="28" y="24" width="24" height="3" rx="1.5" class="line"/><rect x="28" y="33" width="20" height="3" rx="1.5" class="line"/><rect x="28" y="42" width="24" height="3" rx="1.5" class="line"/><circle cx="58" cy="60" r="10" class="sun"/></svg>
        </span>
        <span class="tile-body"><strong class="soft">블로그 · 기록</strong><span>글과 메모를 모아 둘 공간</span></span>
        <span class="tag">준비 중</span>
      </div>
      <div class="card tile soon rise">
        <span class="tile-art" aria-hidden="true">
          <svg viewBox="0 0 80 80"><path d="M12 26a6 6 0 0 1 6-6h14l6 6h24a6 6 0 0 1 6 6v26a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6z" class="folder"/><circle cx="54" cy="46" r="6" class="leafy"/></svg>
        </span>
        <span class="tile-body"><strong class="soft">프로젝트</strong><span>진행 중인 작업과 결과물</span></span>
        <span class="tag">준비 중</span>

      <div class="card tile soon rise">
        <span class="tile-art" aria-hidden="true">
          <svg viewBox="0 0 80 80"><rect x="10" y="30" width="34" height="20" rx="10" class="ring"/><rect x="36" y="30" width="34" height="20" rx="10" class="ring"/></svg>

        <span class="tag">준비 중</span>
      </div>
